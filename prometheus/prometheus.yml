global:
  scrape_interval: 15s
  # Must stay above DOCKER_TIMEOUT_SECONDS in the exporter, otherwise Prometheus
  # gives up before a slow Docker daemon has had its chance to time out.
  scrape_timeout: 12s
  evaluation_interval: 15s
  external_labels:
    monitor: docker-exporter

rule_files:
  - /etc/prometheus/alerts/*.yml

# Point this at your Alertmanager. Left commented out so the local stack starts
# without one.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: docker-exporter
    static_configs:
      - targets: ['docker-exporter:8088']
        labels:
          host: local

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
